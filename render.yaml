services:
  - type: web
    name: vetra
    runtime: node
    plan: starter
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: VETRA_PIX_PRICE
        value: "17"
      - key: DATABASE_URL
        fromDatabase:
          name: vetra-db
          property: connectionString
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: APP_URL
        sync: false
  - type: pserv
    name: vetra-db
    runtime: node
    plan: starter
    databaseName: vetra
    user: vetra
